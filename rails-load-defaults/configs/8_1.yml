# Rails 8.1 Framework Defaults Config Reference
#
# Configs are organized into tiers:
#   tier_1: Safe to flip — trivially low risk
#   tier_2: Low risk — need a quick codebase grep to confirm
#   tier_3: Medium/high risk — need careful analysis, flagged for human review
#
# Processing order: tier_1 first, then tier_2, then tier_3.
#
# NOTE: All 8.1 configs use `Rails.configuration.*` (not `Rails.application.config.*`)
# in the generated initializer — that's the exact syntax Rails 8.1 ships, not a typo.

version: "8.1"

tier_1:
  # ---- Safe / trivially low risk ----

  - config: action_view.remove_hidden_field_autocomplete
    config_line: "Rails.configuration.action_view.remove_hidden_field_autocomplete = true"
    new_default: true
    old_default: false
    risk: very_low
    old_behavior: >
      Hidden inputs generated by `form_tag`, `hidden_field_tag`, `token_tag`,
      `method_tag`, and the hidden fields inside `button_to` forms include
      `autocomplete="off"`.
    new_behavior: "Those hidden inputs no longer render the `autocomplete=\"off\"` attribute."
    lookup:
      - search: "autocomplete.*off"
        in: "app/**/*.rb, app/views/**/*.erb, app/views/**/*.haml, app/assets/**/*.css, app/javascript/**/*"
        reason: "Check if any CSS/JS selectors or tests target hidden fields via [autocomplete=off]"
    decision: >
      Hidden fields are never autofilled by browsers regardless of this
      attribute, so this is purely a rendered-markup change with no
      functional impact for the overwhelming majority of apps. Safe to use
      new default. Only keep `false` if a test or a CSS/JS selector
      specifically targets `input[type=hidden][autocomplete="off"]`.

  - config: action_view.render_tracker
    config_line: "Rails.configuration.action_view.render_tracker = :ruby"
    new_default: ":ruby"
    old_default: "regex-based tracker"
    risk: low
    old_behavior: >
      Action View detects `render` calls inside ERB templates (to compute
      cache digests / dependency tracking for fragment caching) using a
      regex-based scanner, which can miss or misparse `render` calls
      written with unusual Ruby syntax.
    new_behavior: >
      Action View uses an actual Ruby parser to find `render` calls,
      producing more accurate template dependency lists for cache digests.
    lookup:
      - search: "render "
        in: "app/views/**/*.erb"
        reason: "Sanity check for templates with unusual/dynamic render call syntax (heredocs, multi-line calls, string interpolation in the partial name)"
    decision: >
      This only affects automatic dependency tracking used for Russian-doll
      fragment cache invalidation — it does not change what gets rendered.
      The new tracker is strictly more accurate than the regex-based one,
      so at worst you get MORE cache invalidation (safe, if slightly less
      efficient), never less. Safe to use new default in essentially all
      apps. If fragment caching isn't used, this has zero observable effect.

  - config: active_support.escape_js_separators_in_json
    config_line: "Rails.configuration.active_support.escape_js_separators_in_json = false"
    new_default: false
    old_default: true
    risk: low
    old_behavior: >
      `to_json` (and the JSON renderer) escapes LINE SEPARATOR (U+2028) and
      PARAGRAPH SEPARATOR (U+2029) characters, since older JavaScript
      engines treated them as invalid inside string literals.
    new_behavior: >
      Those two characters are no longer escaped by default. This has been
      valid inside JS string literals since ECMAScript 2019, so modern
      browsers are unaffected.
    lookup:
      - search: "\\.to_json\\|to_json("
        in: "app/**/*.rb, app/views/**/*.erb"
        reason: "Find places that embed to_json output directly into a <script> tag or other raw JS context"
      - search: "U+2028\\|U+2029\\|\\\\u2028\\|\\\\u2029"
        in: "app/**/*.rb"
        reason: "Check if the app already handles these characters explicitly"
    decision: >
      Safe to use new default for any app targeting modern browsers (2019+).
      Only a concern if JSON output is consumed by a very old JS engine or
      a non-browser JS runtime that predates ES2019 string literal support
      for these characters — rare. Note this only affects the two
      separator characters, not HTML-entity escaping (`<`, `>`, `&`), which
      is controlled separately by `action_controller.escape_json_responses`.

tier_2:
  # ---- Low risk but needs codebase check ----

  - config: active_record.raise_on_missing_required_finder_order_columns
    config_line: "Rails.configuration.active_record.raise_on_missing_required_finder_order_columns = true"
    new_default: true
    old_default: false
    risk: low
    old_behavior: >
      Order-dependent finder methods (`#first`, `#second`, ... `#forty_two`)
      called without an `order` clause silently fall back to whatever order
      the database happens to return when the model has no
      `implicit_order_column`, `query_constraints`, or `primary_key` to use
      instead — this fallback ordering is unspecified/unstable. Currently
      just logs a deprecation warning.
    new_behavior: >
      Raises `ActiveRecord::MissingRequiredOrderError` in that situation
      instead of silently returning rows in unspecified order.
    lookup:
      - search: "self.primary_key = false\\|self.primary_key = nil\\|primary_key: false"
        in: "app/models/**/*.rb"
        reason: "Find models that explicitly disable primary_key (views, some join tables)"
      - search: "create_table.*id: false"
        in: "db/migrate/**/*.rb, db/schema.rb"
        reason: "Find tables created without a primary key"
      - search: "implicit_order_column\\|query_constraints"
        in: "app/models/**/*.rb"
        reason: "Check which models already set a fallback order column"
    decision: >
      This only raises for models that have NO primary key, NO
      `implicit_order_column`, and NO `query_constraints` set — i.e., a
      model backed by a table/view without a primary key. Most standard
      AR models (which have an `id` primary key) are completely unaffected.
      If no such models are found → safe to use new default; it only
      surfaces a real ordering bug (deprecated already in 8.1, will raise
      unconditionally in 8.2 regardless). If found → either set
      `implicit_order_column`/`query_constraints` on that model, or keep
      `false` temporarily while you audit callers of `#first`/`#last` etc.
      on it.

  - config: action_controller.escape_json_responses
    config_line: "Rails.configuration.action_controller.escape_json_responses = false"
    new_default: false
    old_default: true
    risk: medium
    old_behavior: >
      The JSON renderer (`render json: ...`) escapes `<`, `>`, `&`, and the
      U+2028/U+2029 separator characters in the response body, so the
      output is safe to embed directly inside HTML or a `<script>` tag.
    new_behavior: >
      Those characters are no longer escaped by default (improves
      rendering performance), since `render json:` responses are served as
      `application/json` and aren't normally embedded in an HTML document.
      Escaping still happens automatically when the `:callback` option is
      used (JSONP), since that output is executed as JavaScript.
    lookup:
      - search: "render json:"
        in: "app/controllers/**/*.rb"
        reason: "Find JSON renderer usage"
      - search: "params\\[:callback\\]\\|:callback"
        in: "app/controllers/**/*.rb"
        reason: "Check for JSONP endpoints (Rails still escapes these automatically)"
      - search: "response.body\\|\\.to_json"
        in: "app/views/**/*.erb, app/views/**/*.haml"
        reason: "Check if any view embeds a controller's raw JSON response body directly into HTML/<script> rather than using to_json in the view layer"
    decision: >
      If `render json:` output is only consumed by API clients / fetch/XHR
      as `application/json` → safe to use new default, this is the common
      case and the escaping was never needed there.
      If any code takes a JSON *response body* from an action and re-embeds
      it verbatim into an HTML page (not the normal `render json:` usage —
      look for unusual proxying/embedding patterns) → keep `true`, since
      unescaped `<`, `>`, `&` in that context is an XSS risk.
      JSONP (`:callback`) responses are escaped automatically regardless of
      this setting, so no action needed there.
      When unsure, keep the old default (`true`) — this only trades a
      defense-in-depth escape for a performance gain, so there's little
      upside to rushing it.

  - config: action_controller.action_on_path_relative_redirect
    config_line: "Rails.configuration.action_controller.action_on_path_relative_redirect = :raise"
    new_default: ":raise"
    old_default: ":log"
    risk: medium
    old_behavior: >
      `redirect_to` with a path-relative string that lacks a leading slash
      (e.g. `redirect_to "example.com"` or `redirect_to "@attacker.com"`,
      which browsers can interpret as `scheme://yourdomain.com@attacker.com`)
      only logs a warning and still performs the redirect.
    new_behavior: >
      Raises `ActionController::Redirecting::UnsafeRedirectError` instead
      of silently redirecting, closing an open-redirect-style vector.
    lookup:
      - search: "redirect_to "
        in: "app/controllers/**/*.rb, app/views/**/*.erb"
        reason: "Find all redirect_to calls, especially with dynamic/interpolated or user-influenced strings"
      - search: "redirect_to params\\|redirect_to.*\\.to_s\\|redirect_to.*+\\|redirect_to \\\""
        in: "app/controllers/**/*.rb"
        reason: "Look for redirects built from params, request data, or string concatenation rather than named routes/URL helpers"
    decision: >
      If all `redirect_to` calls use named routes, URL helpers, model/record
      instances, or hardcoded absolute paths (leading `/`) → zero impact,
      safe to use new default.
      If any `redirect_to` call builds a target from a bare host-like
      string, string concatenation, or unsanitized params without a leading
      slash → this is very likely an existing open-redirect bug. Fix the
      target to be an absolute path or a full URL with a validated host,
      rather than suppressing the check.
      Can also be set to `:notify` first to get ActiveSupport notifications
      (with a stack trace) for auditing before flipping to `:raise`.
